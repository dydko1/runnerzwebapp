spring:
  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:memdb
    driver-class-name: org.h2.Driver
#    name: miro123
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  output:
    ansi:
      enabled: ALWAYS