spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mirek
    username: mirek
    password: xxxxx
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    databases: postgresql
    databases-platform: org.hibernate.dialect.PostgreSQLDialect
  #ddl-auto: create-drop
  output:
    ansi:
      enabled: ALWAYS